<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Watcher - Distraction-Free Learning</title>
    <meta name="description" content="Watch YouTube lessons without distractions">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <!-- Landing Page -->
        <div id="landing-page" class="page active">
            <div class="landing-content">
                <div class="hero">
                    <div class="logo-container">
                        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" />
                        </svg>
                        <h1>Focus Watcher</h1>
                    </div>
                    <p class="tagline">Learn without distractions. Watch YouTube lessons with focus.</p>
                </div>

                <div class="url-input-container">
                    <input type="text" id="youtube-url" placeholder="Paste your YouTube lesson URL here..."
                        autocomplete="off">
                    <button id="watch-button" class="primary-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" />
                        </svg>
                        Watch Now
                    </button>
                </div>

                <p class="error-message" id="error-message"></p>

                <div class="features">
                    <div class="feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <span>No Distractions</span>
                    </div>
                    <div class="feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
                            <polyline points="17 2 12 7 7 2" />
                        </svg>
                        <span>Custom Controls</span>
                    </div>
                    <div class="feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        <span>Speed Control</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Page -->
        <div id="player-page" class="page">
            <div class="player-wrapper" id="player-wrapper">
                <div id="youtube-player"></div>

                <!-- Replay Overlay -->
                <div class="replay-overlay" id="replay-overlay">
                    <button class="replay-button" id="replay-button">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12,5V1L7,6l5,5V7c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,5,12,5z" />
                        </svg>
                        Replay Lesson
                    </button>
                </div>

                <!-- Video Controls -->
                <div class="controls-container" id="controls-container">
                    <!-- Progress Bar -->
                    <div class="progress-bar-container" id="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-filled" id="progress-filled"></div>
                            <div class="progress-handle" id="progress-handle"></div>
                        </div>
                    </div>

                    <!-- Control Buttons -->
                    <div class="controls">
                        <div class="controls-left">
                            <!-- Play/Pause -->
                            <button class="control-button" id="play-pause-button" title="Play/Pause (Space)">
                                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="5 3 19 12 5 21 5 3" />
                                </svg>
                                <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="6" y="4" width="4" height="16" />
                                    <rect x="14" y="4" width="4" height="16" />
                                </svg>
                            </button>

                            <!-- Volume -->
                            <div class="volume-control">
                                <button class="control-button" id="volume-button" title="Mute (M)">
                                    <svg class="icon-volume-high" viewBox="0 0 24 24" fill="currentColor">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                                    </svg>
                                    <svg class="icon-volume-muted hidden" viewBox="0 0 24 24" fill="currentColor">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                                        <line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" />
                                        <line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" />
                                    </svg>
                                </button>
                                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100"
                                    value="100">
                            </div>

                            <!-- Time Display -->
                            <div class="time-display">
                                <span id="current-time">0:00</span>
                                <span class="time-separator">/</span>
                                <span id="total-time">0:00</span>
                            </div>
                        </div>

                        <div class="controls-right">
                            <!-- Speed Control -->
                            <button class="control-button speed-button" id="speed-button" title="Playback Speed">
                                1x
                            </button>

                            <!-- Fullscreen -->
                            <button class="control-button" id="fullscreen-button" title="Fullscreen (F)">
                                <svg class="icon-fullscreen-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                                </svg>
                                <svg class="icon-fullscreen-exit hidden" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
                                </svg>
                            </button>

                            <!-- Back to Home -->
                            <button class="control-button back-button" id="back-button" title="Back to Home">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                    <polyline points="9 22 9 12 15 12 15 22" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
